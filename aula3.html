    <script type="text/javascript">
        // Valores base do cálculo
        var vendas = 10000.50;
        var salario_Fixo = 3000.00;

        // Calcular salário com comissão de 15%.
        var salario_Final = salario_Fixo + (vendas * 0.15);
        document.write("Valor a receber = R$ " + salario_Final);

    </script>

    <script type="text/javascript">
        // Inicializa tres variaveis com o mesmo valor.
        var a = b = c = 10;

        // Exemplos de opertadores de atribuição:
        a += b;
        document.write("<br> a = a + b : " + a);

        b *= c;
        document.write("<br> = b * c : " + b);

        a -= c;
        document.write("<br>  a = a - c : " + a);

        a /= c;
        document.write("<br> a = a / c : " + a);

        b %= 2;
        document.write("<br> = b % 2 : " + b);
    </script>

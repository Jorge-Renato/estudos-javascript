    <script type="text/javascript">

        // Exemplo de string numérico:

        var a = "5";

        // concatenação de string com números:
        var x = a + 1 + 2;
        document.write("<br>x = " + x);

        // soma dentro de parênteses antes da concatenação:
        var y = a + (1 + 2);
        document.write("<br> y = " + y);

        // converte para número e depois soma:
        var y = parseInt(a) + (1 + 2);
        document.write("<br> y (parse) = " + y);
    </script>
